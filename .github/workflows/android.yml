# Builds the Dipsons Android app (Trusted Web Activity wrapping /app).
# Output: an UNSIGNED, zip-aligned APK pushed to the "android-build" branch.
# It is signed outside CI with the release key (the key is never stored in this public repo).
name: Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build release APK (unsigned)
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee ../build.log
      - name: Publish to android-build branch
        if: always()
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk out/ 2>/dev/null || true
          cp build.log out/
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          cp $BT/lib/apksigner.jar out/ || true
          echo "${GITHUB_SHA}" > out/SOURCE_COMMIT
          cd out
          git init -q -b android-build
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A && git commit -qm "APK build for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" android-build
