plugins { id 'com.android.application' }

def host = project.property('appHost')

android {
    namespace 'com.dipsons.app'
    compileSdk 34
    defaultConfig {
        applicationId 'in.dipsons.app'
        minSdk 21
        targetSdk 34
        versionCode Integer.parseInt(project.property('appVersionCode'))
        versionName project.property('appVersionName')
        resValue 'string', 'hostName', host
        resValue 'string', 'launchUrl', "https://${host}/app"
        manifestPlaceholders = [hostName: host]
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.core:core:1.13.1'
}
